default: &defaults
  # Your push api key, it is possible to set this dynamically using ERB:
  push_api_key: "<%= ENV['APPSIGNAL_PUSH_API_KEY'] %>"

  # Your app's name
  name: "padma-attendance"

  ignore_actions:
    - PingController#ping
    # High-volume actions (>40K requests in 30 days, reviewed 2026-10-18).
    # Ignored actions do not report performance data or exceptions.
    - Api::V0::ContactsController#sync_from_crm
    - FetchCrmContactJob#perform

  # The cuttoff point in ms above which a request is considered slow, default is 200
  # slow_request_threshold: 200

# Configuration per environment, leave out an environment or set active
# to false to not push metrics for that environment.
development:
  <<: *defaults
  active: false

production:
  <<: *defaults
  active: true

staging:
  <<: *defaults
  active: false
